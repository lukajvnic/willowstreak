[project]
name = "willo-api"
version = "0.1.0"
description = "Willo API — habits, logs, friends, leaderboards"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "supabase>=2.0.0,<3.0.0",
    "postgrest>=2.0.0,<3.0.0",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    # Depends()/Query() in argument defaults is how FastAPI declares dependencies
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# tests build windows relative to the machine's local day on purpose — that is
# exactly what a client does
"tests/*" = ["DTZ011", "S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
